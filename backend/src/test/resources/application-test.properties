# Profile 'test' — sobrescreve a config principal nos testes de integração com Testcontainers.
# A URL/usuário/senha vêm dinamicamente do container via @DynamicPropertySource (na classe-base de teste).
# Aqui só forçamos comportamentos úteis em teste:

# Hibernate continua sem mexer no schema — quem manda é o Flyway
spring.jpa.hibernate.ddl-auto=none

# Reduz ruído no log de teste
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway roda normalmente no banco do container (cria do zero a cada classe se quisermos isolar)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
