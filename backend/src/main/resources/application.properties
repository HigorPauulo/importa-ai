spring.application.name=backend

# ====== DataSource (MySQL local via Docker - infra/docker-compose.yml) ======
spring.datasource.url=jdbc:mysql://localhost:3306/importaai?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${IMPORTAAI_DB_USERNAME:importaai}
spring.datasource.password=${IMPORTAAI_DB_PASSWORD:importaai123}

# Pool HikariCP (default do Spring Boot) - declaro 10 so pra deixar explícito
spring.datasource.hikari.maximum-pool-size=10

# ====== JPA / Hibernate ======
# none = Hibernate NAO mexe no schema. Quem manda no schema é o Flyway (V1__, V2__, ...).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ====== Flyway ======
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ====== RabbitMQ ======
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${IMPORTAAI_RABBITMQ_USERNAME:importaai}
spring.rabbitmq.password=${IMPORTAAI_RABBITMQ_PASSWORD:importaai123}

# Falha rapida se o broker estiver fora
spring.rabbitmq.connection-timeout=5s

# Broker envia ACK apos gravar mensagem
spring.rabbitmq.publisher-confirm-type=correlated

# Mensagem com routing key sem fila volta para producer
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ACK manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Cada consumer pega 10 mesnagem antes do ACK
spring.rabbitmq.listener.simple.prefetch=10

spring.rabbitmq.listener.simple.concurrency=2
spring.jackson.serialization.write-dates-as-timestamps=false

# ====== CORS (origens do frontend; em dev o proxy do Vite cobre o same-origin) ======
importaai.cors.allowed-origins=http://localhost:5173

# ====== JWT ======
jwt.secret=${IMPORTAAI_JWT_SECRET:dev-secret-importaai-NAO-USAR-EM-PROD-trocar-em-producao-ok}
jwt.access-expiration=1h
jwt.refresh-expiration=7d

# ====== Integracao Correios (ADR-004) ======
# stub | http | cache-only
correios.adapter=stub
correios.api.url=https://api.correios.com.br
correios.sync.interval=1200000
correios.cws.usuario=${IMPORTAAI_CORREIOS_USUARIO:}
correios.cws.codigo-acesso=${IMPORTAAI_CORREIOS_CODIGO_ACESSO:}
correios.cws.cartao-postagem=${IMPORTAAI_CORREIOS_CARTAO_POSTAGEM:}

# ====== Resilience4j - Circuit Breaker do CorreiosHttpAdapter ======
resilience4j.circuitbreaker.instances.correios.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.correios.sliding-window-size=5
resilience4j.circuitbreaker.instances.correios.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.correios.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.correios.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.correios.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.correios.automatic-transition-from-open-to-half-open-enabled=false

# ====== Integracao Cambio (RF20, RN07) ======
cambio.api.url=https://economia.awesomeapi.com.br
cambio.sync.interval=1800000
