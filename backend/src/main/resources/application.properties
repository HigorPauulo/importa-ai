spring.application.name=backend

# ====== DataSource (MySQL local via Docker - infra/docker-compose.yml) ======
spring.datasource.url=jdbc:mysql://localhost:3306/importaai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=importaai
spring.datasource.password=importaai123

# Pool HikariCP (default do Spring Boot) - declaro 10 so pra deixar explícito
spring.datasource.hikari.maximum-pool-size=10

# ====== JPA / Hibernate ======
# none = Hibernate NAO mexe no schema. Quem manda no schema é o Flyway (V1__, V2__, ...).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ====== Flyway ======
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ====== RabbitMQ ======
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=importaai
spring.rabbitmq.password=importaai123

# Falha rapida se o broker estiver fora
spring.rabbitmq.connection-timeout=5s

# Broker envia ACK apos gravar mensagem
spring.rabbitmq.publisher-confirm-type=correlated

# Mensagem com routing key sem fila volta para producer
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ACK manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Cada consumer pega 10 mesnagem antes do ACK
spring.rabbitmq.listener.simple.prefetch=10

spring.rabbitmq.listener.simple.concurrency=2
spring.jackson.serialization.write-dates-as-timestamps=false

# ====== JWT ======
jwt.secret=${IMPORTAAI_JWT_SECRET:dev-secret-importaai-NAO-USAR-EM-PROD-trocar-em-producao-ok}
jwt.access-expiration=1h
jwt.refresh-expiration=7d
